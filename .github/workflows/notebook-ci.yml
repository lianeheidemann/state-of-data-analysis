name: Executar notebook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  executar-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar notebook
        run: jupyter nbconvert --to notebook --execute analise_state_of_data_br_2023.ipynb --output /tmp/executed.ipynb
